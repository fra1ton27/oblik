# PostgreSQL для разработки: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oblik
      POSTGRES_PASSWORD: oblik
      POSTGRES_DB: oblik
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oblik -d oblik']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
